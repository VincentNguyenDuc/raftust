services:
    node1:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: raftust-node1
        environment:
            - RAFTUST_STORAGE_DIR=/data
        command:
            - --id
            - "1"
            - --addr
            - 0.0.0.0:5001
            - --peer
            - 2=node2:5002
            - --peer
            - 3=node3:5003
            - --peer
            - 4=node4:5004
            - --peer
            - 5=node5:5005
            - --election-timeout-min
            - "20"
            - --election-timeout-max
            - "40"
            - --heartbeat-interval
            - "4"
            - --log-compaction-threshold
            - "128"
        ports:
            - "5001:5001"
        volumes:
            - node1-data:/data
        stdin_open: true
        tty: true
        healthcheck:
            test: ["CMD-SHELL", "curl -k -s -o /dev/null -w '%{http_code}' https://127.0.0.1:5001/raft -X POST -H 'Content-Type: application/json' -d '{}' | grep -qE '4[0-9][0-9]|2[0-9][0-9]'"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 15s

