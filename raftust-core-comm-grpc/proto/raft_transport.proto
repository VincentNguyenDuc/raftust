syntax = "proto3";

package raftust.transport.v1;

message TransportAck {
  bool accepted = 1;
  string error = 2;
}

message LogEntry {
  uint64 term = 1;
  string command = 2;
}

message RequestVote {
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntries {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message InstallSnapshot {
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
}

message TransportEnvelope {
  uint64 from = 1;
  uint64 to = 2;

  oneof payload {
    RequestVote request_vote = 3;
    RequestVoteResponse request_vote_response = 4;
    AppendEntries append_entries = 5;
    AppendEntriesResponse append_entries_response = 6;
    InstallSnapshot install_snapshot = 7;
    InstallSnapshotResponse install_snapshot_response = 8;
  }
}

service RaftTransport {
  rpc SendMessage(TransportEnvelope) returns (TransportAck);
}